version: 2
updates:
  # Covers fuzz/ too: it shares the workspace's Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Dockerfile's base images, which are pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The Keycloak plugin's build: Keycloak, test libraries and Maven plugins.
  - package-ecosystem: maven
    directory: /keycloak
    schedule:
      interval: weekly
  # The demo's Keycloak image, pinned by digest. A Keycloak bump here and the keycloak.version bump in the maven
  # entry above arrive as separate pull requests; make demo-smoke fails each until both carry the same release, so
  # merge them as one change.
  - package-ecosystem: docker-compose
    directory: /keycloak/demo
    schedule:
      interval: weekly
  # The browser smoke test: the Playwright image and the playwright Python package. They must name the same release;
  # make demo-smoke fails until both do, so merge the two pull requests as one change.
  - package-ecosystem: docker
    directory: /keycloak/demo/browser
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /keycloak/demo/browser
    schedule:
      interval: weekly
