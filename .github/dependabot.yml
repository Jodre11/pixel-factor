version: 2
updates:
  # Covers fuzz/ too: it shares the workspace's Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Dockerfile's base images, which are pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The Keycloak plugin's build: Keycloak, test libraries and Maven plugins.
  - package-ecosystem: maven
    directory: /keycloak
    schedule:
      interval: weekly
  # The demo's Keycloak image, pinned by digest.
  - package-ecosystem: docker-compose
    directory: /keycloak/demo
    schedule:
      interval: weekly
