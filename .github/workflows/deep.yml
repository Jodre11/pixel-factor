name: Deep checks

# Slow checks that would hold up a pull request: known vulnerabilities in
# dependencies, mutation testing and fuzzing. Weekly, or run by hand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: make advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache tools and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: deep-advisories-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/install-tools.sh') }}
      - name: Set up
        run: make setup
      - name: Advisories
        run: make advisories

  mutants:
    name: make mutants
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache tools and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: deep-mutants-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/install-tools.sh') }}
      - name: Set up
        run: |
          make setup
          scripts/install-tools.sh mutants
      - name: Mutation testing
        run: make mutants MUTANTS_JOBS=4
      - name: Show surviving mutants
        if: failure()
        run: cat mutants.out/missed.txt mutants.out/timeout.txt 2>/dev/null || true

  fuzz:
    name: make fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache tools and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: deep-fuzz-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'fuzz/Cargo.lock', 'scripts/install-tools.sh') }}
      - name: Set up
        run: |
          make setup
          rustup toolchain install nightly --profile minimal
          scripts/install-tools.sh fuzz
      - name: Fuzz
        run: make fuzz FUZZ_SECONDS=300
