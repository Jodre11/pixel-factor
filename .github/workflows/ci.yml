name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache tools and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/install-tools.sh') }}

      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Set up
        run: make setup

      - name: Check
        run: make check

      # Starts the real binary and drives it over HTTP.
      - name: Smoke test the service
        run: make smoke

      # Proves the narrower path works too, so it can be trusted locally.
      - name: Scoped check
        if: github.event_name == 'pull_request'
        run: scripts/check-changed.sh "origin/${{ github.base_ref }}"

      - name: Commit conventions
        if: github.event_name == 'pull_request'
        run: scripts/check-commits.sh "origin/${{ github.base_ref }}"

  coverage:
    name: make coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache tools and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: coverage-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/install-tools.sh') }}

      - name: Set up
        run: |
          make setup
          scripts/install-tools.sh coverage

      - name: Coverage
        run: make coverage

  container:
    name: container
    runs-on: ubuntu-26.04
    env:
      IMAGE: pixel-factor-service:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan the Dockerfile and workflows
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Build the image
        run: make image

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Runs the image as it would be deployed and drives it over HTTP.
      - name: Smoke test the image
        run: make container-smoke

  keycloak:
    name: keycloak plugin and demo
    runs-on: ubuntu-26.04
    env:
      IMAGE: pixel-factor-service:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Maven runs in a container pinned by digest; no JDK on the runner.
      - name: Check the plugin
        run: make plugin-check

      # Keycloak and the service in compose, then a login through Keycloak's own pages: by form posts, then in
      # Chromium (desktop, emulated phone, keyboard).
      - name: Smoke test the demo
        run: make demo-smoke

      - name: Keep screenshots of a failed browser test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke
          path: target/browser-smoke/
          if-no-files-found: ignore
