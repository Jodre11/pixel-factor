name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache tools and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/install-tools.sh') }}

      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Set up
        run: make setup

      - name: Check
        run: make check

      # Proves the narrower path works too, so it can be trusted locally.
      - name: Scoped check
        if: github.event_name == 'pull_request'
        run: scripts/check-changed.sh "origin/${{ github.base_ref }}"

      - name: Commit conventions
        if: github.event_name == 'pull_request'
        run: scripts/check-commits.sh "origin/${{ github.base_ref }}"

  coverage:
    name: make coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache tools and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: coverage-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/install-tools.sh') }}

      - name: Set up
        run: |
          make setup
          scripts/install-tools.sh coverage

      - name: Coverage
        run: make coverage
