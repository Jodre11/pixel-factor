[package]
name = "pixel-factor-core"
version = "0.1.0"
edition = "2021"
description = "Breach-resistant verification of an ordered sequence of taps on an image, with hexagonal tolerance"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jodre11/pixel-factor"

[dependencies]
argon2 = "0.6"
hmac = "0.13"
sha2 = "0.11"
subtle = "2"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
hex = { version = "0.4", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
